<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Flow Field — Tuning Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#FCFCFA; --ink:#0B0B0E; --mut:#6A6A72; --fnt:#A8A8AE;
  --line:#E7E7E1; --navy:#002D99;
}
html,body{height:100%}
body{
  font-family:'Instrument Sans',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;
  letter-spacing:-.01em;overflow:hidden;
}
.mono{font-family:'Geist Mono',ui-monospace,monospace;letter-spacing:0}

.stage{position:fixed;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.veil{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,rgba(252,252,250,.88) 0%,rgba(252,252,250,.55) 46%,rgba(252,252,250,.15) 100%);
}
.veil.off{display:none}
.hero{
  position:relative;z-index:3;height:100%;max-width:1360px;margin:0 auto;
  padding:0 44px 240px;display:flex;flex-direction:column;justify-content:center;
  pointer-events:none;transition:opacity .3s;
}
.hero.hide{opacity:0}
.k{
  font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mut);display:flex;align-items:center;gap:14px;margin-bottom:32px;
}
.k i{width:8px;height:8px;border-radius:50%;background:var(--navy);display:block}
h1{
  font-size:clamp(50px,9vw,140px);font-weight:620;letter-spacing:-.052em;line-height:.94;
  max-width:12ch;margin-bottom:44px;
}
h1 .u{position:relative;white-space:nowrap}
h1 .u::after{content:'';position:absolute;left:0;bottom:.02em;height:.045em;width:100%;background:var(--navy)}
.sub{font-size:clamp(16px,1.5vw,20px);color:var(--mut);line-height:1.55;max-width:450px}

/* cycle progress hairline */
.prog{position:fixed;left:0;top:0;height:2px;background:var(--navy);opacity:.5;z-index:30;width:0;transition:width .12s linear}
.prog.drain{background:var(--fnt)}

.panel{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(252,252,250,.93);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);padding:14px 24px 16px;
  transition:transform .35s cubic-bezier(.16,1,.3,1);
}
.panel.min{transform:translateY(calc(100% - 42px))}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:28px;margin-bottom:12px}
.ptitle{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  background:none;border:1px solid var(--line);color:var(--ink);
  padding:6px 11px;border-radius:2px;cursor:pointer;transition:border-color .2s,color .2s;
}
.chip:hover{border-color:var(--ink)}
.chip.on{border-color:var(--navy);color:var(--navy)}
.tools{display:flex;gap:6px}
.rows{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 26px}
.ctl{display:flex;align-items:center;gap:10px}
.ctl label{
  font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut);width:78px;flex-shrink:0;
}
.ctl input[type=range]{flex:1;height:2px;-webkit-appearance:none;appearance:none;background:var(--line);outline:none}
.ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--ink);cursor:pointer}
.ctl input[type=range]::-moz-range-thumb{width:11px;height:11px;border:none;border-radius:50%;background:var(--ink);cursor:pointer}
.ctl .val{font-family:'Geist Mono',monospace;font-size:10.5px;color:var(--ink);width:42px;text-align:right;flex-shrink:0}
.ctl select{flex:1;font-family:'Geist Mono',monospace;font-size:10.5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:5px 7px;border-radius:2px}
.readout{
  margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
  font-family:'Geist Mono',monospace;font-size:10.5px;color:var(--mut);
  white-space:nowrap;overflow-x:auto;
}
.readout b{color:var(--navy);font-weight:500}
.readout .ph{color:var(--ink)}
@media(max-width:1100px){.rows{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.rows{grid-template-columns:1fr}.hero{padding:0 22px 280px}}
</style>
</head>
<body>

<div class="prog" id="prog"></div>

<div class="stage">
  <canvas id="cv"></canvas>
  <div class="veil" id="veil"></div>
  <div class="hero" id="hero">
    <div class="k"><i></i><span>Early-Stage Venture · Frontier Technology · Shanghai</span></div>
    <h1>Conviction before <span class="u">consensus.</span></h1>
    <p class="sub">We back founders building frontier technology — writing the first check, often before the company exists.</p>
  </div>
</div>

<div class="panel" id="panel">
  <div class="pbar">
    <span class="ptitle">Flow Field — Tuning</span>
    <div class="presets" id="presets"></div>
    <div class="tools">
      <button class="chip" id="cycleBtn">↻ Reset</button>
      <button class="chip" id="veilBtn">Veil</button>
      <button class="chip" id="textBtn">Text</button>
      <button class="chip" id="minBtn">▾</button>
    </div>
  </div>
  <div class="rows" id="rows"></div>
  <div class="readout" id="readout"></div>
</div>

<script>
const PAPER='#FCFCFA';
const ink=a=>`rgba(11,11,14,${a})`;
const TAU=Math.PI*2;
const R=(a,b)=>a+Math.random()*(b-a);

/* ════════ parameters ════════ */
const P={
  field:'curl',
  density:1.0,
  speed:1.15,
  tail:78,        // trail-layer fade  → 拖尾长度
  residue:50,     // ink-layer opacity → 流过后留下的痕迹
  alpha:0.13,
  scale:1.0,
  width:0.8,
  depth:1,
  cycle:50,       // seconds per loop, 0 = 关闭循环
  emit:65         // % of the cycle that still spawns new lines
};
const trailFade = tail => 0.006 + (100-tail)/100*0.070;

const PRESETS={
  'Original':  {field:'angle', density:1.0,speed:1.00,tail:24,residue:0, alpha:0.15,scale:1.0,width:0.85,depth:0,cycle:0, emit:65},
  'Long Tails':{field:'angle', density:1.0,speed:1.30,tail:72,residue:0, alpha:0.13,scale:1.0,width:0.80,depth:0,cycle:0, emit:65},
  'Silk':      {field:'curl',  density:1.2,speed:1.15,tail:82,residue:45,alpha:0.11,scale:1.0,width:0.75,depth:1,cycle:50,emit:65},
  'Painted':   {field:'curl',  density:1.0,speed:1.25,tail:70,residue:88,alpha:0.12,scale:1.0,width:0.75,depth:1,cycle:60,emit:58},
  'Vortex':    {field:'vortex',density:1.1,speed:1.25,tail:76,residue:55,alpha:0.13,scale:1.0,width:0.80,depth:1,cycle:45,emit:65},
  'Whisper':   {field:'curl',  density:0.8,speed:1.00,tail:88,residue:30,alpha:0.075,scale:1.2,width:0.70,depth:1,cycle:70,emit:70}
};

/* ════════ field config — re-randomised every cycle ════════ */
function makeField(){
  return {
    modes:[1.00,0.62,0.45,0.30].map(a=>({
      a:a*R(0.8,1.25), kx:R(-2,2), ky:R(-2,2), w:R(-0.14,0.14), ph:R(0,TAU)
    })),
    vort:Array.from({length:4},()=>({
      x:R(.15,.85), y:R(.18,.82), s:R(.6,1.1)*(Math.random()<.5?-1:1),
      r:R(.22,.36), d:R(-.035,.035)
    })),
    ang:{ax:R(.0026,.0044),ay:R(.0032,.005),axy:R(.0012,.0021),
         p1:R(0,TAU),p2:R(0,TAU),p3:R(0,TAU),
         w1:R(.10,.22),w2:R(-.18,-.08),w3:R(.04,.10)},
    drift:{x:R(.15,.4)*(Math.random()<.5?-1:1), y:R(.05,.2)*(Math.random()<.5?-1:1)}
  };
}
let FIELD=makeField();

/* ════════ canvas + layers ════════ */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,S0=1,ps=[];
let trailC,trailX,inkC,inkX;

function makeLayers(){
  trailC=document.createElement('canvas'); inkC=document.createElement('canvas');
  for(const c of [trailC,inkC]){ c.width=Math.round(W*DPR); c.height=Math.round(H*DPR); }
  trailX=trailC.getContext('2d'); inkX=inkC.getContext('2d');
  trailX.setTransform(DPR,0,0,DPR,0,0); inkX.setTransform(DPR,0,0,DPR,0,0);
  trailX.lineCap=inkX.lineCap='round';
}
function clearLayers(){ trailX.clearRect(0,0,W,H); inkX.clearRect(0,0,W,H); }
/* fade toward transparent so the two layers can be composited */
function fadeLayer(x,amt){
  if(amt<=0) return;
  x.save();
  x.globalCompositeOperation='destination-out';
  x.fillStyle=`rgba(0,0,0,${amt})`;
  x.fillRect(0,0,W,H);
  x.restore();
}

function vel(x,y,t,out){
  if(P.field==='angle'){
    const A=FIELD.ang, f=1/P.scale;
    const a = Math.sin(x*A.ax*f + t*A.w1 + A.p1)*1.5
            + Math.cos(y*A.ay*f + t*A.w2 + A.p2)*1.5
            + Math.sin((x+y)*A.axy*f + t*A.w3 + A.p3)*1.1;
    out[0]=Math.cos(a); out[1]=Math.sin(a); return;
  }
  if(P.field==='vortex'){
    let vx=FIELD.drift.x, vy=FIELD.drift.y;
    const Rm=Math.min(W,H);
    for(const v of FIELD.vort){
      const cx=(v.x+0.09*Math.sin(t*v.d*3))*W;
      const cy=(v.y+0.09*Math.cos(t*v.d*3.7))*H;
      const dx=x-cx, dy=y-cy, sg=v.r*Rm*P.scale;
      const g=Math.exp(-(dx*dx+dy*dy)/(2*sg*sg))*v.s;
      vx+=-dy/sg*g; vy+= dx/sg*g;
    }
    const L=Math.hypot(vx,vy)||1; out[0]=vx/L; out[1]=vy/L; return;
  }
  const u=x/S0, v2=y/S0;                       // curl ψ — divergence free
  let vx=0,vy=0;
  for(const m of FIELD.modes){
    const c=Math.cos(m.kx*u+m.ky*v2+m.w*t+m.ph)*m.a;
    vx+= m.ky*c; vy+= -m.kx*c;
  }
  const L=Math.hypot(vx,vy)||1; out[0]=vx/L; out[1]=vy/L;
}

function spawn(initial){
  const x=Math.random()*W, y=Math.random()*H;
  const life=420+Math.random()*640;
  return {x,y,px:x,py:y,dead:false,
          age:initial?Math.random()*life:0, life,
          seed:Math.random(), b:(Math.random()*3)|0};
}
function reseed(){
  const N=Math.max(40, Math.round(W*H/2600*P.density));
  ps=new Array(N).fill(0).map(()=>spawn(true));
}
function fit(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  S0=Math.min(W,H)/3.1*P.scale;
  makeLayers(); clearLayers(); reseed();
}
addEventListener('resize',fit);

/* ════════ cycle ════════ */
let cycleStart=0;
function newCycle(t){ cycleStart=t; FIELD=makeField(); reseed(); clearLayers(); }
function phaseOf(t){
  if(P.cycle<=0) return {emit:true,drain:0,prog:0};
  const p=(t-cycleStart)/P.cycle, e=P.emit/100;
  return {emit:p<e, drain:p<e?0:Math.min(1,(p-e)/(1-e)), prog:Math.min(1,p)};
}

/* ════════ render ════════ */
const o=[0,0];
const BA=[0.62,1.0,1.42], BW=[0.8,1.0,1.28];
const progEl=document.getElementById('prog');

function frame(t){
  if(P.cycle>0 && t-cycleStart>=P.cycle) newCycle(t);
  const ph=phaseOf(t);

  fadeLayer(trailX, trailFade(P.tail));
  const inkFade = ph.drain>0 ? 0.0012 + ph.drain*ph.drain*0.022
                             : (P.cycle>0 ? 0 : 0.0007);
  fadeLayer(inkX, inkFade);

  /* integrate */
  for(let i=0;i<ps.length;i++){
    const p=ps[i]; if(p.dead) continue;
    p.px=p.x; p.py=p.y;
    vel(p.x,p.y,t,o);
    const sp=P.speed*(0.75+p.seed*0.6)*(P.depth?(0.7+p.b*0.3):1);
    p.x+=o[0]*sp; p.y+=o[1]*sp;
    p.age++;
    if(p.x<-30||p.x>W+30||p.y<-30||p.y>H+30||p.age>p.life){
      if(ph.emit) ps[i]=spawn(false); else p.dead=true;   // drain: 不再补充新线
    }
  }

  /* one Path2D per depth bucket, stroked into both layers */
  const nb=P.depth?3:1;
  const inkA=P.alpha*(P.residue/100)*0.6;
  for(let b=0;b<nb;b++){
    const path=new Path2D();
    let any=false;
    for(let i=0;i<ps.length;i++){
      const p=ps[i];
      if(p.dead) continue;
      if(P.depth && p.b!==b) continue;
      if(p.px===p.x && p.py===p.y) continue;        // just spawned
      path.moveTo(p.px,p.py); path.lineTo(p.x,p.y); any=true;
    }
    if(!any) continue;
    const aMul=P.depth?BA[b]:1, wMul=P.depth?BW[b]:1;
    trailX.strokeStyle=ink(P.alpha*aMul); trailX.lineWidth=P.width*wMul; trailX.stroke(path);
    if(inkA>0.0005){ inkX.strokeStyle=ink(inkA*aMul); inkX.lineWidth=P.width*wMul; inkX.stroke(path); }
  }

  /* composite */
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,W,H);
  ctx.drawImage(inkC,0,0,W,H);
  ctx.drawImage(trailC,0,0,W,H);

  /* progress hairline */
  if(P.cycle>0){
    progEl.style.width=(ph.prog*100)+'%';
    progEl.classList.toggle('drain',ph.drain>0);
  } else progEl.style.width='0';

  liveReadout(ph,t);
}
let t0=performance.now();
const nowT=()=>(performance.now()-t0)/1000;
function loop(now){ frame((now-t0)/1000); requestAnimationFrame(loop); }

/* ════════ UI ════════ */
const SLIDERS=[
  {k:'field'},
  {k:'density',label:'Density', min:0.3,max:2.6,step:0.1, onchange:reseed},
  {k:'speed',  label:'Speed',   min:0.4,max:3.0,step:0.05},
  {k:'tail',   label:'Tail',    min:5,  max:96, step:1},
  {k:'residue',label:'Residue', min:0,  max:100,step:1},
  {k:'alpha',  label:'Ink',     min:0.03,max:0.34,step:0.005},
  {k:'scale',  label:'Scale',   min:0.5,max:2.5,step:0.05, onchange:()=>{S0=Math.min(W,H)/3.1*P.scale}},
  {k:'width',  label:'Weight',  min:0.5,max:1.8,step:0.05},
  {k:'cycle',  label:'Cycle s', min:0,  max:180,step:5},
  {k:'emit',   label:'Emit %',  min:20, max:95, step:5},
  {k:'depth'}
];
const rows=document.getElementById('rows');
SLIDERS.forEach(s=>{
  const d=document.createElement('div'); d.className='ctl';
  if(s.k==='field'){
    d.innerHTML=`<label>Field</label><select id="fieldSel">
      <option value="angle">angle · 原版</option>
      <option value="curl">curl ψ · 不可压缩</option>
      <option value="vortex">vortex · 涡旋</option></select>`;
  }else if(s.k==='depth'){
    d.innerHTML=`<label>Depth</label><select id="depthSel">
      <option value="1">on · 三层景深</option><option value="0">off</option></select>`;
  }else{
    d.innerHTML=`<label>${s.label}</label>
      <input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${P[s.k]}" data-k="${s.k}">
      <span class="val" data-v="${s.k}"></span>`;
  }
  rows.appendChild(d);
  const inp=d.querySelector('input');
  if(inp) inp.addEventListener('input',e=>{ P[s.k]=parseFloat(e.target.value); if(s.onchange)s.onchange(); sync(); });
});
const fieldSel=document.getElementById('fieldSel'), depthSel=document.getElementById('depthSel');
fieldSel.addEventListener('change',e=>{P.field=e.target.value;clearLayers();sync()});
depthSel.addEventListener('change',e=>{P.depth=+e.target.value;clearLayers();sync()});

const presetsEl=document.getElementById('presets');
Object.keys(PRESETS).forEach(name=>{
  const b=document.createElement('button'); b.className='chip'; b.textContent=name;
  b.onclick=()=>{
    Object.assign(P,PRESETS[name]);
    S0=Math.min(W,H)/3.1*P.scale;
    newCycle(nowT());
    sync(name);
  };
  presetsEl.appendChild(b);
});

let activePreset='Silk';
function sync(active){
  if(active) activePreset=active;
  document.querySelectorAll('input[data-k]').forEach(i=>{ i.value=P[i.dataset.k] });
  document.querySelectorAll('[data-v]').forEach(s=>{
    const k=s.dataset.v;
    s.textContent = (k==='tail'||k==='residue'||k==='cycle'||k==='emit')
      ? P[k] : (+P[k]).toFixed(k==='alpha'?3:2);
  });
  fieldSel.value=P.field; depthSel.value=String(P.depth);
  document.querySelectorAll('.presets .chip').forEach(c=>c.classList.toggle('on',c.textContent===activePreset));
}
function liveReadout(ph,t){
  const el=document.getElementById('readout');
  const cyc = P.cycle>0
    ? `<span class="ph">${ph.drain>0?'drain':'emit'}</span> ${(ph.prog*P.cycle).toFixed(0)}s / ${P.cycle}s`
    : `<span class="ph">off</span>`;
  el.innerHTML =
    `<b>settings</b> field:${P.field} · density:${P.density.toFixed(1)} · speed:${P.speed.toFixed(2)} `+
    `· tail:${P.tail} · residue:${P.residue} · ink:${P.alpha.toFixed(3)} · scale:${P.scale.toFixed(2)} `+
    `· weight:${P.width.toFixed(2)} · depth:${P.depth?'on':'off'} · cycle:${P.cycle} · emit:${P.emit} `+
    `&nbsp;&nbsp;<b>phase</b> ${cyc}`;
}

document.getElementById('cycleBtn').onclick=()=>newCycle(nowT());
document.getElementById('minBtn').onclick=e=>{
  const p=document.getElementById('panel');
  p.classList.toggle('min'); e.target.textContent=p.classList.contains('min')?'▴':'▾';
};
document.getElementById('veilBtn').onclick=e=>{
  document.getElementById('veil').classList.toggle('off'); e.target.classList.toggle('on');
};
document.getElementById('textBtn').onclick=e=>{
  document.getElementById('hero').classList.toggle('hide'); e.target.classList.toggle('on');
};

fit();
Object.assign(P,PRESETS['Silk']); S0=Math.min(W,H)/3.1*P.scale;
FIELD=makeField(); reseed(); clearLayers(); sync('Silk');
requestAnimationFrame(loop);
</script>
</body>
</html>
